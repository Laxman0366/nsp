<div id="carouselInterval" class="carousel slide" data-coreui-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-coreui-target="#carouselInterval" data-coreui-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-coreui-target="#carouselInterval" data-coreui-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-coreui-target="#carouselInterval" data-coreui-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    @for (slide of slides; track slide.src) {
      <div class="carousel-item" [class.active]="slide.id === 0" data-coreui-interval="2000">
        <img [src]="slide.src" class="d-block w-100" alt="...">
        <div class="carousel-caption d-none d-md-block">
          <h5>{{ slide.title }}</h5>
          <p>{{ slide.subtitle }}</p>
        </div>
      </div>
    }
  </div>
  <button class="carousel-control-prev" type="button" data-coreui-target="#carouselInterval" data-coreui-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-coreui-target="#carouselInterval" data-coreui-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
