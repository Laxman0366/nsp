<div id="carouselInterval" class="carousel slide" data-coreui-ride="carousel">
  <div class="carousel-indicators">
    @for (slide of slides; track slide.id; let i = $index) {
      <button
        type="button"
        data-coreui-target="#carouselInterval"
        [attr.data-coreui-slide-to]="i"
        [class.active]="i === 0"
        [attr.aria-current]="i === 0 ? 'true' : null"
        [attr.aria-label]="'Slide ' + (i + 1)"
      ></button>
    }
  </div>
  <div class="carousel-inner">
    @for (slide of slides; track slide.id; let i = $index) {
      <div class="carousel-item" [class.active]="i === 0" data-coreui-interval="2000">
        <img [src]="slide.src" class="d-block w-100" [alt]="slide.altText">
        <div class="carousel-caption d-none d-md-block">
          <h5>{{ slide.title }}</h5>
          <p>{{ slide.subtitle }}</p>
        </div>
      </div>
    }
  </div>
  <button class="carousel-control-prev" type="button" data-coreui-target="#carouselInterval" data-coreui-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-coreui-target="#carouselInterval" data-coreui-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
