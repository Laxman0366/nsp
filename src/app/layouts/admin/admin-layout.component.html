<mat-sidenav-container class="admin-layout-shell">
  <mat-sidenav mode="side" opened class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="/assets/images/logos/nsp_logo.jpeg" alt="NSP logo" class="sidebar-logo" />
      <div>
        <div class="sidebar-title">nsp</div>
        <div class="sidebar-subtitle">Free</div>
      </div>
    </div>

    <mat-accordion class="sidebar-accordion" multi>
      @for (group of menuGroups; track group.path) {
        <mat-expansion-panel class="sidebar-panel" [expanded]="isGroupActive(group)">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>{{ group.icon }}</mat-icon>
              <span>{{ group.label }}</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-nav-list>
            @for (item of group.items; track item.path) {
              <a
                mat-list-item
                [routerLink]="itemPath(group.path, item.path)"
                routerLinkActive="active-link"
                class="sidebar-link sidebar-sub-link"
              >
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            }
          </mat-nav-list>
        </mat-expansion-panel>
      }
    </mat-accordion>

    <div class="sidebar-footer">
      <a class="logout-link" href="" (click)="$event.preventDefault(); logout()">Logout</a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <mat-toolbar class="admin-topbar" color="primary">
      <div class="topbar-spacer"></div>
      <button mat-icon-button class="topbar-notification" aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button class="topbar-avatar" aria-label="Profile">
        <img src="/assets/images/profile/user-1.jpg" alt="Profile" />
      </button>
    </mat-toolbar>

    <div class="admin-page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
