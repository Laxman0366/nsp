<mat-sidenav-container class="admin-layout-shell">
  <mat-sidenav #sidenav mode="side" opened class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="/assets/images/logos/nsp_logo.jpeg" alt="NSP logo" class="sidebar-logo" />
      <div>
        <div class="sidebar-title">MatDash</div>
        <div class="sidebar-subtitle">Free</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">HOME</div>
      <mat-nav-list>
        <a mat-list-item routerLink="/admin" routerLinkActive="active-link" class="sidebar-link">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
      </mat-nav-list>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">APPS</div>
      <mat-nav-list>
        <a mat-list-item routerLink="/admin/chat" routerLinkActive="active-link" class="sidebar-link">
          <mat-icon>chat</mat-icon>
          <span>Chat</span>
        </a>
        <a mat-list-item routerLink="/admin/calendar" routerLinkActive="active-link" class="sidebar-link">
          <mat-icon>calendar_month</mat-icon>
          <span>Calendar</span>
        </a>
        <a mat-list-item routerLink="/admin/email" routerLinkActive="active-link" class="sidebar-link">
          <mat-icon>email</mat-icon>
          <span>Email</span>
        </a>
      </mat-nav-list>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-upgrade-box">
        <div class="upgrade-icon">★</div>
        <div>
          <div class="upgrade-label">Check Pro Version</div>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <mat-toolbar class="admin-topbar" color="primary">
      <button mat-icon-button (click)="sidenav.toggle()" class="topbar-menu-button" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="topbar-spacer"></div>
      <button mat-flat-button color="accent" class="topbar-pro-button">Check Pro Template</button>
      <button mat-icon-button class="topbar-notification" aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button class="topbar-avatar" aria-label="Profile">
        <img src="/assets/images/profile/user-1.jpg" alt="Profile" />
      </button>
    </mat-toolbar>

    <div class="admin-page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
