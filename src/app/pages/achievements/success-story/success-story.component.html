<div class="container">
  <p class="eyebrow">{{ 'nav.successStory' | translate }}</p>
  <p class="title-hint">{{ 'page.successStoryHint' | translate }}</p>

  <mat-card class="intro-card">
    <mat-card-content>
      <p>
        {{ 'page.successStoryIntro' | translate }}
      </p>
    </mat-card-content>
  </mat-card>

  <div class="story-list" *ngIf="stories.length; else emptyState">
    <mat-card class="story-row" *ngFor="let story of stories; trackBy: trackByStoryId">
      <mat-card-content>
        <div class="story-media" *ngIf="getStoryImage(story)">
          <img [src]="getStoryImage(story)" [alt]="story.title || 'Success story'" />
        </div>
        <div class="story-body">
          <p class="story-title">{{ story.title || ('common.untitled' | translate) }}</p>
          <p class="story-proverb" *ngIf="story.sub_title">{{ story.sub_title }}</p>
          <p>{{ story.description }}</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <ng-template #emptyState>
    <mat-card class="intro-card">
      <mat-card-content>
        <p>{{ 'common.noRecordsFound' | translate }}</p>
      </mat-card-content>
    </mat-card>
  </ng-template>
</div>
