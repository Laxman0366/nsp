<div class="container">
  <p class="eyebrow">{{ 'nav.successStory' | translate }}</p>
  <p class="title-hint">{{ 'page.successStoryHint' | translate }}</p>

  <mat-card class="intro-card">
    <mat-card-content>
      <p>
        {{ 'page.successStoryIntro' | translate }}
      </p>
    </mat-card-content>
  </mat-card>

  <div class="story-list" *ngIf="stories.length; else emptyState">
    <mat-card class="story-row" *ngFor="let story of stories; trackBy: trackByStoryId">
      <mat-card-content>
        <div class="story-media" *ngIf="story.imageUrl">
          <img [src]="story.imageUrl" [alt]="story.altText" />
        </div>
        <div class="story-body">
          <p class="story-title">{{ story.title || ('common.untitled' | translate) }}</p>
          <p class="story-proverb" *ngIf="story.subTitle">{{ story.subTitle }}</p>
          <div
            class="story-description"
            *ngIf="story.description"
            #storyText
            [attr.data-story-id]="story.id"
            [class.expanded]="isExpanded(story.id)"
            [innerHTML]="story.description"
          ></div>
          <button
            type="button"
            class="story-toggle"
            *ngIf="story.description && isToggleVisible(story.id)"
            (click)="toggleStory(story.id)"
          >
            {{ (isExpanded(story.id) ? 'common.readLess' : 'common.readMore') | translate }}
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <ng-template #emptyState>
    <mat-card class="intro-card">
      <mat-card-content>
        <p>{{ 'common.noRecordsFound' | translate }}</p>
      </mat-card-content>
    </mat-card>
  </ng-template>
</div>
