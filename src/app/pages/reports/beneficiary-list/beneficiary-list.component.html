<div class="container">
  <p class="eyebrow">Beneficiary List</p>
  <p class="title-hint">Project-wise beneficiary count and latest updates</p>

  <mat-card class="report-table-card">
    <mat-card-content>
      <div class="table-wrap">
        <table class="report-table">
          <thead>
            <tr>
              <th>Sl No</th>
              <th>Project Name</th>
              <th>No of Beneficiaries</th>
              <th>Last Updated On</th>
              <th>Download</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of rows">
              <td>{{ row.slNo }}</td>
              <td>{{ row.projectName }}</td>
              <td>{{ row.noOfBeneficiaries }}</td>
              <td>{{ row.createdDate }}</td>
              <td>
                <a
                  class="download-btn"
                  [class.disabled]="!row.downloadUrl"
                  [attr.href]="row.downloadUrl || null"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  {{ row.downloadLabel }}
                </a>
              </td>
            </tr>
            <tr *ngIf="!rows.length">
              <td colspan="5" class="empty-state">No records found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
