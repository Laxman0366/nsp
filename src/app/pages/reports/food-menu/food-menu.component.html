<div class="container">
  <p class="eyebrow">{{ 'nav.foodMenu' | translate }}</p>
  <p class="title-hint">{{ 'page.foodMenuHint' | translate }}</p>

  <mat-card class="report-table-card">
    <mat-card-content>
      <div class="table-wrap">
        <table class="report-table">
          <thead>
            <tr>
              <th>{{ 'common.slNo' | translate }}</th>
              <th>{{ 'common.titleCol' | translate }}</th>
              <th>{{ 'common.download' | translate }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of rows">
              <td>{{ row.slNo }}</td>
              <td>{{ row.title }}</td>
              <td>
                <a
                  class="download-btn"
                  [class.disabled]="!row.downloadUrl"
                  [attr.href]="row.downloadUrl || null"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  {{ row.downloadLabel }}
                </a>
              </td>
            </tr>
            <tr *ngIf="!rows.length">
              <td colspan="4" class="empty-state">{{ 'common.noRecordsFound' | translate }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
