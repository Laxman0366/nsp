<div class="contact-container">
  <p class="eyebrow">Contact Us</p>
  <mat-card>
    <mat-card-content class="contact-card-content">
      <div class="contact-form-panel">
        <p>Get in touch with us. We'd love to hear from you.</p>
        <form>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Name</mat-label>
            <input matInput />
          </mat-form-field>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="email" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Message</mat-label>
            <textarea matInput rows="5"></textarea>
          </mat-form-field>
          <button mat-raised-button color="accent">Send</button>
        </form>
      </div>

      <aside class="contact-map-panel">
        <p class="address-title">Nilachal Seva Pratisthan</p>
        <p class="address-text">
          AT-Benagaon (Dayavihar), P.O-Gadasahi, P.S-Kanas, Dist-Puri,
          Odisha-752017
        </p>
        <p class="address-text">Phone: 9437524416</p>
        <p class="address-text">Email: nspodisha@gmail.com</p>

        <div class="map-frame">
          <iframe
            title="NSP location map"
            src="https://www.google.com/maps?q=AT-Benagaon%20(Dayavihar),%20P.O-Gadasahi,%20P.S-Kanas,%20Dist-Puri,%20Odisha-752017&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </aside>
    </mat-card-content>
  </mat-card>
</div>
